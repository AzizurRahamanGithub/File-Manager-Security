<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Management Dashboard</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- Import Heroicons for icons used in the design -->

  <!-- Fontawesome Icon link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script src="https://unpkg.com/heroicons@1.0.6/dist/heroicons.min.js"></script>

  <!-- For Handeling delete -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Custom scrollbar for file lists */
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: rgba(100, 116, 139, 0.4);
      border-radius: 3px;
    }
  </style>

</head>

<body class="bg-gray-50 text-gray-800 font-sans selection:bg-blue-400 selection:text-white min-h-screen flex select-none">
  <!-- <div id="app"></div> -->
  <!-- Sidebar -->
  <aside class="w-64 flex flex-col border-r border-gray-200 bg-white">
    <span class=" mt-5 mx-auto text-3xl p-0 m-0 font-bold"> <span class="text-6xl text-[#0080C4]">C</span>loud<span
        class="text-4xl text-[#0080C4]">V</span>ault</span>
    <nav class="flex flex-col flex-grow py-8 px-4">
      <!-- Sidebar menu -->
      <ul class="space-y-2 flex-grow mt-3">
        <li>
          <a href="#"
            class="flex items-center space-x-3 px-3 py-2 cursor-pointer text-gray-600 hover:text-[#0080C4] hover:bg-blue-50 rounded-md">
            <i class="fa-solid fa-house text-2xl hover:"></i>
            <span class="font-medium">Home</span>
          </a>
        </li>
        <li>
          <a href="#"
            class="flex items-center space-x-3 px-3 py-2 cursor-pointer text-gray-600 hover:text-[#0080C4] hover:bg-blue-50 rounded-md">
            <i class="fa-regular fa-folder-open text-2xl text-gray-600"></i>
            <span class="font-medium">Files</span>
          </a>
          <ul class="ml-9 mt-1 text-sm text-gray-400 space-y-1">
            <li class="hover:text-gray-600 cursor-pointer">New Files</li>
            <li class="hover:text-gray-600 cursor-pointer">This Months</li>
            <li class="hover:text-gray-600 cursor-pointer">Older Files</li>
          </ul>
        </li>
      </ul>

      <!-- In your top navigation bar -->
      <div id="breadcrumbs" class="flex items-center text-sm text-gray-600">
        <!-- Breadcrumbs will appear here -->
      </div>

    </nav>
  </aside>

  <!-- Main content -->
  <main id="container"
    class="flex flex-col flex-grow min-h-screen px-6 pb-6 bg-gray-50 overflow-auto scrollbar-thin scrollbar-thumb-rounded scrollbar-thumb-gray-400">

    <!-- Topbar: Search + Buttons -->
    <div class="flex items-center justify-between ">

      <div class=" flex  items-center gap-20">
        <div class="flex *:text-2xl gap-5">
          <button
            class="flex items-center space-x-2 border border-gray-300 rounded-full px-2 shadow-sm text-gray-700 text-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <i class="fa-solid fa-arrow-left text-[#0080C4]"></i>
          </button>

          <button
            class="flex items-center space-x-2 border border-gray-300 rounded-full px-2 py-1.5 shadow-sm text-gray-700 text-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <i class="fa-solid fa-arrow-right text-[#0080C4]"></i>
          </button>

        </div>

        <div class="relative flex-grow w-lg">


          <input type="search" aria-label="Search files, folders" placeholder="Search files, folders"
            class="pl-10 pr-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 text-sm w-full" />
          <div class="absolute left-3 top-2 text-gray-400 pointer-events-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>

        </div>

      </div>

      <div class="flex space-x-3">
        <button id="createFolder"
          class="flex items-center space-x-2 border border-gray-300 rounded-md px-3 py-1.5 shadow-sm text-gray-700 text-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <i class="fa-solid fa-plus text-lg text-gray-500"></i>
          <span class="font-bold text-gray-500">Create</span>
        </button>
        <button
          class="flex items-center space-x-3 bg-[#0080C4] hover:text-white text-slate-100 rounded-md px-4.5 py-1.5 shadow-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <i class="fa-solid fa-upload text-lg"></i>
          <span class="font-bold">Upload</span>
        </button>
      </div>
    </div>


    <!-- Browse Files Section -->
    <section class=" flex flex-col h-full w-full" oncontextmenu="disableContextMenu(event) " id="browseFileFolder">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2 text-gray-700 font-semibold text-sm">
          <span class="text-2xl font-bold">Browse Folders</span>
        </div>
      </div>

      <!-- In your main content area -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 " id="foldersGrid">
        <!-- Files and folders will appear here -->


      </div>
    </section>

    <!-- Your existing selection box -->
    <div id="selectionBox"
      class="absolute border-1 border-dashed border-[#0080C4] bg-[#0080C4]/10 hidden pointer-events-none z-50"></div>

    <!-- this is past menu for the right click -->

    <!-- Paste Menu -->
<div id="custom-paste-menu"
     class="hidden fixed bg-white shadow-lg rounded-md py-1 w-48 z-50 border border-gray-200">
  <div class="paste-option px-4 py-2 hover:bg-gray-100 cursor-pointer text-gray-800">Paste</div>
</div>


<!-- Move confirmation dialog (add to your HTML) -->
<div id="moveDialog" class="hidden fixed inset-0 bg-black bg-opacity-50 flex-col items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 max-w-md w-full">
    <h3 class="text-lg font-medium mb-4">Move Items</h3>
    <p class="mb-4">Move <span id="moveCount">X</span> items to this location?</p>
    <div class="flex justify-end space-x-3">
      <button class="px-4 py-2 border rounded-md">Cancel</button>
      <button class="confirm-move px-4 py-2 bg-blue-500 text-white rounded-md">Move Here</button>
    </div>
  </div>
</div>


  </main>


  <!-- Popup Modal -->
  <!-- create-folder-modal.html -->
<div id="createFolderModal" class="hidden fixed inset-0 z-50">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-gray-500/75 transition-opacity" aria-hidden="true"></div>

  <!-- Modal Content -->
  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <form id="createFolderForm">
            <div class="sm:flex sm:items-start">
              <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:size-10">
                <i class="fa-solid fa-folder-plus text-[#0080C4] text-lg"></i>
              </div>
              <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                <h3 class="text-base font-semibold text-gray-900">Create Folder</h3>
                <div class="mt-2">
                  <p class="text-sm text-gray-500">Enter the name of the folder you want to create.</p>
                  <input type="text" id="newFolderName" placeholder="Folder name"
                         class="mt-3 w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" required />
                </div>
              </div>
            </div>
        </div>
        <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
          <button type="submit"
                  class="inline-flex w-full justify-center rounded-md bg-[#0080C4] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:ml-3 sm:w-auto">
            Create
          </button>
          </form>
          <button id="cancelCreateFolder" type="button"
                  class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- share-modal -->
<div id="shareModal" class="hidden fixed inset-0 z-50">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-gray-500/75 transition-opacity" aria-hidden="true"></div>

  <!-- Modal Content -->
  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-blue-100 sm:mx-0 sm:size-10">
              <i class="fa-solid fa-share-nodes text-[#0080C4] text-lg"></i>
            </div>
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
              <h3 class="text-base font-semibold text-gray-900">Share Items</h3>
              <div class="mt-2">
                <p class="text-sm text-gray-500">Here's your shareable link:</p>
                <div class="mt-3 flex">
                  <input type="text" id="shareLink" readonly
                         class="flex-1 border border-gray-300 rounded-l-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                  <button id="copyShareLink"
                          class="bg-[#0080C4] text-white px-3 py-2 rounded-r-md text-sm hover:bg-blue-600">
                    Copy
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
          <button id="cancelShare" type="button"
                  class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
